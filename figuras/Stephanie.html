
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malinche - Visor 3D</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f2e5cd;
      color: #432c49;
    }

    #panel {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 2;
      padding: 15px 18px;
      background: rgba(255, 250, 240, 0.92);
      border-radius: 14px;
      box-shadow: 0 4px 18px #533c3820;
      max-width: 290px;
    }

    h2 {
      margin: 0 0 7px;
      font-size: 19px;
    }

    p {
      margin: 5px 0;
      font-size: 12px;
      line-height: 1.5;
    }

    button {
      border: none;
      padding: 10px 14px;
      margin-top: 10px;
      margin-right: 5px;
      border-radius: 8px;
      background: #743d78;
      color: white;
      cursor: pointer;
    }

    button:hover { background: #522657; }

    #ayuda {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 95%;
      text-align: center;
      font-size: 12px;
      background: #fffaf0df;
      padding: 10px 15px;
      border-radius: 20px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="panel">
    <h2>Guerrera ancestral</h2>
    <p>Modelo tridimensional inspirado en mi ilustración.</p>
    <p>Colores: morado, turquesa, dorado y negro.</p>
    <button id="girar">Pausar giro</button>
    <button id="frente">Vista frontal</button>
  </div>

  <div id="ayuda">
    Arrastra con el mouse para girar · Rueda para acercar o alejar
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ESCENA
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#f2e5cd');

    const camera = new THREE.PerspectiveCamera(
      38, window.innerWidth / window.innerHeight, 0.1, 100
    );
    camera.position.set(0, 3.1, 10.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    document.body.appendChild(renderer.domElement);

    // CONTROLES
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.65, 0);
    controls.enableDamping = true;
    controls.minDistance = 5;
    controls.maxDistance = 16;
    controls.maxPolarAngle = Math.PI * 0.88;

    // ILUMINACIÓN
    scene.add(new THREE.HemisphereLight(0xfff3dc, 0x65516a, 2.0));

    const luz = new THREE.DirectionalLight(0xffffff, 3.0);
    luz.position.set(4, 8, 6);
    luz.castShadow = true;
    luz.shadow.mapSize.set(1024, 1024);
    scene.add(luz);

    const relleno = new THREE.DirectionalLight(0x9ce9df, 1.1);
    relleno.position.set(-5, 4, -3);
    scene.add(relleno);

    // MATERIALES
    const material = (color, extra = {}) =>
      new THREE.MeshStandardMaterial({
        color,
        roughness: 0.78,
        ...extra
      });

    const piel = material('#986532');
    const pielLuz = material('#b17c3e');
    const pelo = material('#171614');
    const morado = material('#773778');
    const moradoOscuro = material('#48204f');
    const moradoClaro = material('#a45d9b');
    const turquesa = material('#36b9b1');
    const turquesaClaro = material('#9adbd1');
    const oro = material('#e5ad36', { metalness: 0.35, roughness: 0.48 });
    const blanco = material('#f5ead7');
    const negro = material('#211923');
    const ojo = material('#fff4db');

    // GRUPO DEL PERSONAJE
    const guerrera = new THREE.Group();
    scene.add(guerrera);

    // FUNCIONES PARA CREAR PIEZAS
    function esfera(parent, x, y, z, sx, sy, sz, mat) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(1, 16, 12), mat
      );
      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function caja(parent, x, y, z, sx, sy, sz, mat) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(sx, sy, sz), mat
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cilindro(parent, x, y, z, rt, rb, h, mat, lados = 12) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(rt, rb, h, lados), mat
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function unir(parent, a, b, radio, mat, lados = 10) {
      const inicio = new THREE.Vector3(...a);
      const fin = new THREE.Vector3(...b);
      const diferencia = new THREE.Vector3().subVectors(fin, inicio);

      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radio * 0.86, radio, diferencia.length(), lados
        ),
        mat
      );

      mesh.position.copy(inicio).add(fin).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        diferencia.normalize()
      );
      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // PIERNAS
    for (const lado of [-1, 1]) {
      const x = lado * 0.43;

      unir(guerrera, [x, 1.55, 0], [x + lado * 0.07, 0.72, 0],
        0.19, pielLuz);
      esfera(guerrera, x + lado * 0.07, 0.75, 0,
        0.20, 0.28, 0.20, pielLuz);

      // Polainas moradas
      cilindro(guerrera, x + lado * 0.07, 0.39, 0,
        0.145, 0.17, 0.48, moradoOscuro, 10);

      // Bordes turquesa
      cilindro(guerrera, x + lado * 0.07, 0.63, 0,
        0.19, 0.19, 0.09, turquesa, 10);

      // Botas
      unir(guerrera,
        [x + lado * 0.07, 0.22, 0],
        [x + lado * 0.07, 0.10, 0.13],
        0.16, oro);

      esfera(guerrera, x + lado * 0.07, 0.10, 0.17,
        0.25, 0.105, 0.34, oro);

      caja(guerrera, x + lado * 0.07, 0.045, 0.17,
        0.43, 0.07, 0.48, negro);
    }

    // CADERA Y FALDA
    cilindro(guerrera, 0, 1.88, 0,
      0.48, 0.48, 0.28, moradoOscuro, 12);

    // Falda acampanada
    cilindro(guerrera, 0, 1.36, 0,
      0.39, 0.79, 1.02, morado, 10);

    // Panel frontal claro
    caja(guerrera, 0, 1.32, 0.405,
      0.25, 1.02, 0.055, blanco);

    // Adornos geométricos de la falda
    for (const lado of [-1, 1]) {
      const franja = caja(guerrera, lado * 0.48, 1.28, 0.39,
        0.19, 0.19, 0.045, moradoOscuro);
      franja.rotation.z = lado * -0.55;

      for (let i = 0; i < 3; i++) {
        const adorno = caja(guerrera,
          lado * (0.27 + i * 0.15),
          1.12 + i * 0.13,
          0.47 - i * 0.015,
          0.10, 0.065, 0.035, moradoOscuro);
        adorno.rotation.z = lado * -0.6;
      }
    }

    // TORSO
    cilindro(guerrera, 0, 2.12, 0,
      0.39, 0.48, 0.57, piel, 12);

    // Brazos y brazaletes
    for (const lado of [-1, 1]) {
      unir(guerrera,
        [lado * 0.39, 2.38, 0],
        [lado * 0.68, 1.92, 0.02],
        0.16, pielLuz);

      unir(guerrera,
        [lado * 0.68, 1.92, 0.02],
        [lado * 0.72, 1.52, 0.04],
        0.12, piel);

      esfera(guerrera, lado * 0.72, 1.47, 0.04,
        0.115, 0.17, 0.12, pielLuz);

      cilindro(guerrera, lado * 0.70, 1.82, 0.02,
        0.145, 0.145, 0.16, turquesaClaro, 8);

      // Hombreras
      esfera(guerrera, lado * 0.43, 2.42, 0,
        0.25, 0.14, 0.24, morado);
    }

    // COLLAR GRANDE
    const collar = new THREE.Mesh(
      new THREE.TorusGeometry(0.65, 0.15, 8, 16),
      moradoClaro
    );
    collar.position.set(0, 2.52, 0.02);
    collar.rotation.x = Math.PI / 2.5;
    collar.scale.set(1.12, 0.68, 1);
    collar.castShadow = true;
    guerrera.add(collar);

    // Pechera frontal morada
    const pecho = esfera(guerrera, 0, 2.42, 0.22,
      0.53, 0.22, 0.18, morado);
    pecho.rotation.z = Math.PI;

    // Decoración del collar
    for (let i = 0; i < 9; i++) {
      const angulo = Math.PI + (i / 8) * Math.PI;
      const x = Math.cos(angulo) * 0.61;
      const y = 2.51 + Math.sin(angulo) * 0.30;

      const gota = esfera(guerrera, x, y, 0.13,
        0.055, 0.12, 0.045, moradoOscuro);
      gota.rotation.z = -x * 0.7;
    }

    // CUELLO
    cilindro(guerrera, 0, 2.78, 0,
      0.16, 0.17, 0.34, piel, 10);

    // CABELLO LARGO
    esfera(guerrera, 0, 3.34, -0.06,
      0.49, 0.60, 0.34, pelo);

    // Mechones laterales
    for (const lado of [-1, 1]) {
      esfera(guerrera, lado * 0.39, 3.12, -0.02,
        0.18, 0.43, 0.22, pelo);

      esfera(guerrera, lado * 0.37, 2.88, -0.01,
        0.14, 0.26, 0.18, pelo);
    }

    // ROSTRO
    esfera(guerrera, 0, 3.34, 0.22,
      0.34, 0.44, 0.29, pielLuz);

    // Orejas
    for (const lado of [-1, 1]) {
      esfera(guerrera, lado * 0.34, 3.32, 0.18,
        0.075, 0.13, 0.07, oro);
      esfera(guerrera, lado * 0.35, 3.15, 0.19,
        0.035, 0.09, 0.04, turquesa);
    }

    // Ojos, cejas y nariz
    for (const lado of [-1, 1]) {
      caja(guerrera, lado * 0.135, 3.40, 0.478,
        0.13, 0.045, 0.035, negro);

      caja(guerrera, lado * 0.135, 3.46, 0.474,
        0.15, 0.045, 0.035, pelo);

      const ceja = caja(guerrera, lado * 0.135, 3.51, 0.47,
        0.17, 0.055, 0.04, pelo);
      ceja.rotation.z = lado * -0.18;
    }

    unir(guerrera, [0, 3.40, 0.48], [0.02, 3.28, 0.51],
      0.035, piel);

    caja(guerrera, 0, 3.19, 0.488,
      0.13, 0.025, 0.025, moradoOscuro);

    // TOCADO TURQUESA
    // Base ancha sobre la cabeza
    caja(guerrera, 0, 3.76, 0.04,
      0.87, 0.18, 0.31, turquesa);

    // Parte superior negra
    esfera(guerrera, 0, 3.89, -0.01,
      0.46, 0.30, 0.29, pelo);

    // Placa central
    caja(guerrera, 0, 3.91, 0.25,
      0.40, 0.32, 0.09, turquesa);

    // Símbolo dorado central
    const rombo = caja(guerrera, 0, 3.94, 0.315,
      0.19, 0.24, 0.055, oro);
    rombo.rotation.z = Math.PI / 4;

    // Adornos laterales dorados
    for (const lado of [-1, 1]) {
      const pieza = caja(guerrera, lado * 0.27, 3.83, 0.26,
        0.17, 0.11, 0.06, oro);
      pieza.rotation.z = lado * 0.5;

      const cinta = caja(guerrera, lado * 0.33, 3.49, 0.03,
        0.12, 0.52, 0.17, turquesa);
      cinta.rotation.z = lado * -0.04;

      caja(guerrera, lado * 0.33, 3.68, 0.14,
        0.13, 0.07, 0.07, oro);
    }

    // Plumas o puntas superiores
    for (let i = 0; i < 3; i++) {
      const pluma = caja(guerrera,
        (i - 1) * 0.22, 4.06 - Math.abs(i - 1) * 0.04, 0.04,
        0.11, 0.29, 0.10, i === 1 ? oro : turquesa);
      pluma.rotation.z = (i - 1) * -0.35;
    }

    // PISO
    const suelo = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      material('#f2e5cd')
    );
    suelo.rotation.x = -Math.PI / 2;
    suelo.position.y = -0.02;
    suelo.receiveShadow = true;
    scene.add(suelo);

    // SOMBRA SUAVE
    const luzSuelo = new THREE.Mesh(
      new THREE.CircleGeometry(1.1, 32),
      new THREE.MeshBasicMaterial({
        color: '#b4a18c',
        transparent: true,
        opacity: 0.24,
        depthWrite: false
      })
    );
    luzSuelo.rotation.x = -Math.PI / 2;
    luzSuelo.scale.set(1.2, 0.55, 1);
    luzSuelo.position.y = 0.005;
    scene.add(luzSuelo);

    // BOTONES
    let girando = true;

    document.getElementById('girar').addEventListener('click', () => {
      girando = !girando;
      document.getElementById('girar').textContent =
        girando ? 'Pausar giro' : 'Reanudar giro';
    });

    document.getElementById('frente').addEventListener('click', () => {
      guerrera.rotation.y = 0;
      camera.position.set(0, 3.1, 10.5);
      controls.target.set(0, 2.65, 0);
      controls.update();
    });

    // ANIMACIÓN
    function animar() {
      requestAnimationFrame(animar);

      if (girando) {
        guerrera.rotation.y += 0.006;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animar();

    // AJUSTAR AL TAMAÑO DE LA VENTANA
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
